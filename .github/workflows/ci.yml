name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The whole point of the demo. What the agent can do is what this token can do.
permissions:
  contents: read

jobs:
  lint:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run tests (and write a JUnit report)
        run: |
          mkdir -p results
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=results/junit.xml \
            "dist/**/*.test.js"

      # Durable evidence: logs scroll away, artifacts stay for the retention period.
      # if: always() so a failing run still uploads its report. The SHA in the name
      # answers "which run, against which code?"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: results/
          retention-days: 14
